<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#082a30"/>
<title>Lagon Island Kitchen — Real 3D Dish Carousel</title>
<script type="module" src="../model-viewer-FXu0v758.js"></script>
<style>
*{box-sizing:border-box}html,body{padding:0;margin:0;background:#061e26;color:#f8f6eb;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
:root{--gold:#e9c68a;--soft:#aac8c7;--dark:#082e34}
main{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 59% 48%,#286666 0%,#0c3b43 46%,#061c25 100%)}
main:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(138deg,transparent 0px 100px,#ffffff04 101px 102px)}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:23px min(5vw,65px);position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:10px}.emblem{border:1px solid var(--gold);color:var(--gold);border-radius:50%;width:43px;height:43px;display:grid;place-items:center;font:27px Georgia,serif}
.logo strong{display:block;font-size:14px;letter-spacing:.22em}.logo small{display:block;font-size:8px;letter-spacing:.2em;color:#b7d0cb;margin-top:3px}
.chip{font-size:10px;letter-spacing:.12em;color:#c9dad5;border:1px solid #7da5a1;border-radius:99px;padding:9px 14px}
.info{z-index:8;position:absolute;top:24%;left:6%;width:33%;max-width:345px;pointer-events:none}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:800}
h1{font:normal clamp(43px,5vw,78px)/1.04 Georgia,serif;letter-spacing:-.048em;margin:18px 0}
h1 em{color:var(--gold);font-style:italic}
.description{font-size:14px;line-height:1.65;color:#c6d9d7;max-width:290px;min-height:72px}
.portion{font-size:12px;letter-spacing:.06em;color:#bcd1cc;margin-top:14px}
.price{font:34px Georgia,serif;color:var(--gold);margin:10px 0}
.add{pointer-events:auto;cursor:pointer;background:var(--gold);color:#19373a;border:0;border-radius:99px;padding:14px 21px;font-size:11px;letter-spacing:.11em;font-weight:900;text-transform:uppercase}
.stage{position:absolute;inset:92px 0 90px;z-index:3;pointer-events:none}
.orbit-line{position:absolute;width:56vw;max-width:730px;height:130px;left:59%;top:77%;transform:translate(-50%,-50%);border:1px solid #e7c88d40;border-radius:50%;box-shadow:0 0 80px #e7c88d14;pointer-events:none}
.model-card{position:absolute;top:49%;left:59%;height:min(65vh,510px);width:min(39vw,480px);max-height:530px;max-width:480px;transform:translate(-50%,-50%);transition:transform .55s cubic-bezier(.25,.8,.25,1),opacity .55s,filter .55s;pointer-events:auto;cursor:pointer}
.model-card model-viewer{display:block;width:100%;height:100%;background:transparent;--poster-color:transparent;--progress-bar-color:#e9c68a;outline:none}
.model-card.side model-viewer{pointer-events:none}
.model-card.selected{cursor:grab}.model-card.selected model-viewer{pointer-events:auto}
.model-card:not(.selected){filter:saturate(.8);opacity:.73}
.model-card.back{opacity:.42;filter:saturate(.65)}
.model-card .load-state{position:absolute;top:82%;left:50%;transform:translateX(-50%);font-size:10px;color:#d3e2db;white-space:nowrap;pointer-events:none}
.model-card.loaded .load-state{display:none}
.model-card.failed .load-state{color:#ffc7a0}
.model-card .name-tag{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#06262cba;border:1px solid #bdcbbd55;border-radius:30px;color:#f7e9d2;padding:6px 11px;font-size:10px;white-space:nowrap;pointer-events:none}
.model-card.selected .name-tag{display:none}
.model-card:not(.selected) .name-tag{display:block}
.navigation{position:absolute;left:6%;bottom:10%;z-index:15;display:flex;align-items:center;gap:12px}
.nav{width:45px;height:45px;border:1px solid #9cb9b6;background:#ffffff13;border-radius:50%;color:white;font-size:26px;cursor:pointer}
.counter{font-size:12px;letter-spacing:.15em;color:#c6d8d7;padding:0 10px}
.tip{position:absolute;left:6%;bottom:4%;z-index:15;color:#b2ccc8;font-size:10px;letter-spacing:.1em}
.wheel{width:310px;height:320px;position:absolute;right:0;bottom:0;z-index:22;pointer-events:none;overflow:hidden}
.ring{width:290px;height:290px;left:114px;top:16px;position:absolute;border-radius:50%;border:1px solid #e9c68a82;background:radial-gradient(circle at 40% 50%,#e9c68a16,transparent 58%)}
.hub{left:211px;top:122px;width:94px;height:94px;position:absolute;background:linear-gradient(140deg,#e9d29e,#b28d50);box-shadow:0 0 24px #f2c17944;border-radius:50%;display:grid;place-items:center;text-align:center;color:#17373a;font-size:10px;font-weight:900;letter-spacing:.12em;line-height:1.4}
.dish-thumb{position:absolute;border:2px solid #d5d8ca;width:59px;height:59px;border-radius:50%;overflow:hidden;padding:0;background:#204e50;pointer-events:auto;cursor:pointer;box-shadow:0 8px 19px #0009;transition:transform .2s,border-color .2s}
.dish-thumb img{height:100%;width:100%;object-fit:cover}
.dish-thumb.active{transform:scale(1.17);border:3px solid var(--gold);box-shadow:0 0 0 4px #e9c68a38,0 8px 21px #0008}
.status{position:absolute;right:5%;top:90px;z-index:18;color:#b9d0cb;font-size:11px;letter-spacing:.06em}
.toast{position:absolute;bottom:93px;left:50%;transform:translateX(-50%);z-index:30;padding:12px 17px;border-radius:30px;color:#193b3e;background:var(--gold);font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
@media(max-width:700px){
header{padding:17px 20px}.logo .emblem{width:37px;height:37px;font-size:24px}.logo strong{font-size:12px}.logo small{font-size:7px}.chip{font-size:9px;padding:7px 9px}
.info{top:13%;left:7%;width:86%;max-width:350px}
h1{font-size:clamp(43px,11vw,56px);margin:10px 0}.description{max-width:280px;font-size:12px;line-height:1.45;min-height:0}.portion{margin-top:7px}.price{font-size:26px;margin:6px 0}.add{padding:12px 15px;font-size:10px}
.stage{inset:35% 0 8%;}.orbit-line{left:50%;width:100vw;top:74%}
.model-card{left:50%;top:48%;height:min(52vh,380px);width:min(65vw,320px)}
.navigation{left:7%;bottom:6%;gap:8px}.counter{font-size:10px;padding:0 5px}
.tip{bottom:2%;left:7%;font-size:8px;width:190px}
.wheel{transform:scale(.73);transform-origin:right bottom}
.status{top:66px;right:22px;font-size:9px}
}
@media(prefers-reduced-motion:reduce){.model-card,.dish-thumb{transition:none}}
</style></head>
<body>
<main><header><div class="logo"><div class="emblem">L</div><div><strong>LAGON</strong><small>ISLAND KITCHEN</small></div></div><span class="chip">REAL 3D FOOD MENU</span></header>
<div class="status" id="status">LOADING 5 ORIGINAL 3D MODELS</div>
<div class="info"><div class="eyebrow" id="eyebrow">01 / ISLAND STARTERS</div><h1 id="heading">Gâteau<br><em>Piment</em></h1><div class="description" id="description">Split-pea fritters with fresh herbs and a chilli kick.</div><div class="portion" id="portion">6 pcs · Starter</div><div class="price" id="price">Rs 525</div><button id="add" class="add">+ Add to order</button></div>
<div class="stage" id="stage"><div class="orbit-line"></div></div>
<div class="navigation"><button id="previous" class="nav" aria-label="Previous dish">‹</button><span class="counter" id="counter">01 — 05</span><button id="next" class="nav" aria-label="Next dish">›</button></div>
<div class="tip">SWIPE TO CHANGE DISHES · DRAG TO ROTATE · PINCH TO ZOOM</div>
<div class="wheel" id="wheel"><div class="ring"></div><div class="hub">CHOOSE<br>DISH</div></div>
<div class="toast" id="toast"></div>
</main>
<script>
const dishes=[
{n:"Gâteau Piment",cat:"ISLAND STARTERS",desc:"Split-pea fritters with fresh herbs and a chilli kick.",portion:"6 pcs · Starter",p:525,model:"Gâteau Piment.glb",photo:"Gâteau Piment.webp"},
{n:"Seafood Gratin",cat:"ISLAND STARTERS",desc:"Tender seafood baked under a golden, creamy crust.",portion:"250g · Starter",p:650,model:"Seafood Gratin.glb",photo:"Seafood Gratin.webp"},
{n:"Bol Renversé",cat:"ISLAND MAINS",desc:"Fragrant rice, chicken and vegetables crowned with an egg.",portion:"450g · Main",p:625,model:"Bol Renversé.glb",photo:"Bol Renversé.webp"},
{n:"Poudine Maïs",cat:"ISLAND DESSERTS",desc:"Soft cornmeal pudding with coconut and vanilla.",portion:"180g · Dessert",p:510,model:"Poudine Maïs.glb",photo:"Poudine Maïs.webp"},
{n:"Alouda Milkshake",cat:"ISLAND DRINKS",desc:"Chilled milk with basil seeds and a vanilla finish.",portion:"300ml · Drink",p:535,model:"Alouda Milkshake.glb",photo:"Alouda Milkshake.webp"}
];
const $=id=>document.getElementById(id),root="./../",asset=name=>root+encodeURIComponent(name);
let current=0,count=0,ready=0;
const cards=[],thumbs=[];
dishes.forEach((d,i)=>{
 const holder=document.createElement("div");holder.className="model-card";holder.setAttribute("aria-label","3D model of "+d.n);
 const viewer=document.createElement("model-viewer");viewer.setAttribute("src",asset(d.model));viewer.setAttribute("alt","Interactive 3D model of "+d.n);viewer.setAttribute("camera-controls","");viewer.setAttribute("interaction-prompt","none");viewer.setAttribute("environment-image","neutral");viewer.setAttribute("shadow-intensity","0.5");viewer.setAttribute("exposure","1.55");viewer.setAttribute("loading","eager");viewer.setAttribute("reveal","auto");viewer.setAttribute("camera-orbit","0deg 70deg 110%");viewer.setAttribute("field-of-view","30deg");
 const loader=document.createElement("div");loader.className="load-state";loader.textContent="Loading 3D…";
 const tag=document.createElement("span");tag.className="name-tag";tag.textContent=d.n;
 holder.append(viewer,loader,tag);$("stage").append(holder);cards.push(holder);
 viewer.addEventListener("load",()=>{if(!holder.classList.contains("loaded")){holder.classList.add("loaded");ready++;$("status").textContent=ready+"/5 3D MODELS LOADED";}});
 viewer.addEventListener("error",()=>{holder.classList.add("failed");loader.textContent="3D model failed to load";$("status").textContent="3D model error · retry in Chrome";});
 holder.addEventListener("click",()=>{if(i!==current)show(i)});
 const angle=(116+i*31)*Math.PI/180,cx=258,cy=165,r=139;
 const b=document.createElement("button");b.className="dish-thumb";b.style.left=(cx+r*Math.cos(angle)-29.5)+"px";b.style.top=(cy-r*Math.sin(angle)-29.5)+"px";b.title=d.n;b.setAttribute("aria-label","Select "+d.n);
 const photo=new Image();photo.src=asset(d.photo);photo.alt=d.n;b.append(photo);b.addEventListener("click",()=>show(i));$("wheel").append(b);thumbs.push(b);
});
function show(i){
 current=(i+5)%5;const d=dishes[current],names=d.n.split(" ");
 $("heading").innerHTML=names[0]+"<br><em>"+names.slice(1).join(" ")+"</em>";
 $("eyebrow").textContent=String(current+1).padStart(2,"0")+" / "+d.cat;
 $("description").textContent=d.desc;$("portion").textContent=d.portion;$("price").textContent="Rs "+d.p;$("counter").textContent=String(current+1).padStart(2,"0")+" — 05";
 const mobile=window.innerWidth<=700;
 cards.forEach((holder,j)=>{let diff=j-current;while(diff>2)diff-=5;while(diff< -2)diff+=5;
  const dist=Math.abs(diff),dx=diff*(mobile?170:300),dy=dist===0?0:dist===1?35:60,sc=dist===0?1.13:dist===1?.7:.45;
  holder.style.transform="translate(-50%,-50%) translate3d("+dx+"px,"+dy+"px,0) scale("+sc+")";
  holder.style.zIndex=String(8-dist);
  holder.classList.toggle("selected",dist===0);holder.classList.toggle("side",dist!==0);holder.classList.toggle("back",dist===2);
  const viewer=holder.querySelector("model-viewer");
  if(dist===0){viewer.setAttribute("auto-rotate","");viewer.setAttribute("camera-controls","");}else{viewer.removeAttribute("auto-rotate");viewer.removeAttribute("camera-controls");}
 });
 thumbs.forEach((b,j)=>b.classList.toggle("active",j===current));
}
$("previous").addEventListener("click",()=>show(current-1));$("next").addEventListener("click",()=>show(current+1));
$("add").addEventListener("click",()=>{count++;$("toast").textContent=dishes[current].n+" added · "+count+" in demo cart";$("toast").style.opacity="1";setTimeout(()=>$("toast").style.opacity="0",1900)});
let startX=null;
$("stage").addEventListener("pointerdown",e=>{startX=e.clientX});
$("stage").addEventListener("pointerup",e=>{if(startX===null)return;const delta=e.clientX-startX;if(Math.abs(delta)>75)show(current+(delta<0?1:-1));startX=null});
window.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(current+1);if(e.key==="ArrowLeft")show(current-1)});
window.addEventListener("resize",()=>show(current));
show(0);
setTimeout(()=>{if(ready===0)$("status").textContent="If 3D stays blank, open this page in Chrome";},14000);
</script></body></html>
